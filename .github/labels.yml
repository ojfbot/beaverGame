# Source of truth for labels in this repo.
# `scripts/seed-github.sh` reads this and creates them via `gh label create`.

# Type — pick one
- name: type:adr
  color: "5319e7"
  description: Architecture Decision Record (proposed or active)
- name: type:feat
  color: "0e8a16"
  description: New capability
- name: type:fix
  color: "d73a4a"
  description: Bug or regression
- name: type:infra
  color: "1d76db"
  description: CI, build, tooling
- name: type:test
  color: "fbca04"
  description: New tests or visual-regression baselines
- name: type:docs
  color: "0075ca"
  description: README, CLAUDE.md, ADR cross-links
- name: type:spike
  color: "c2e0c6"
  description: Time-boxed exploration with explicit exit criterion

# Phase — pick one
- name: phase:0
  color: "ededed"
  description: First asset in browser (closed)
- name: phase:1
  color: "c5def5"
  description: Client hardening, CI, controller bounds
- name: phase:2
  color: "bfd4f2"
  description: Mode A playable (camera, locomotion, water, terrain)
- name: phase:3
  color: "b9c8e8"
  description: Mode A building loop (felling, hauling, damming, lodge)
- name: phase:4
  color: "8c9bd6"
  description: Mode B (Watershed) — water sim, suburb, twilight cycle, NPCs
- name: phase:5
  color: "5d6dab"
  description: Polish, deploy, ship

